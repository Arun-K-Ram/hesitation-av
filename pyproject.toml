[tool.poetry]
name = "hesitation-av"
version = "0.1.0"
description = "Interpretable temporal decision framework for ambiguity-aware autonomous hesitation"
authors = ["Arunkumar Ramachandran"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^2.4.6"
opencv-python = "^4.13.0.92"
ultralytics = "^8.4.56"
scipy = "^1.17.1"
websockets = "^16.0"
pyyaml = "^6.0.3"
matplotlib = "^3.10.9"
pandas = "^3.0.3"
filterpy = "^1.4.5"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.4.0"
jupyter = "^1.1.1"
ipykernel = "^7.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"